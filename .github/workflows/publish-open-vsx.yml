name: Publish to Open VSX

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to sync (for example v1.4.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: open-vsx-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.repository == 'Whwitpohe/linyra'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.registry.outputs.ready }}
    steps:
      - name: Check namespace verification and active extension
        id: registry
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('ready', 'false');
            const namespaceResponse = await fetch('https://open-vsx.org/api/whwitpohe', { signal: AbortSignal.timeout(30000) });
            if (!namespaceResponse.ok) throw new Error(`Cannot check Open VSX namespace: HTTP ${namespaceResponse.status}`);
            const namespace = await namespaceResponse.json();
            if (namespace.verified !== true) {
              core.info('Waiting for Open VSX namespace ownership verification; no upload was attempted.');
              await core.summary.addHeading('Open VSX publication is waiting')
                .addRaw('The whwitpohe namespace is not verified. No package was uploaded.\n\n')
                .addLink('Namespace ownership request #14842', 'https://github.com/EclipseFdn/open-vsx.org/issues/14842').write();
              return;
            }
            const extensionResponse = await fetch('https://open-vsx.org/api/whwitpohe/linyra/latest', { signal: AbortSignal.timeout(30000) });
            if (extensionResponse.status === 404) {
              core.info('Waiting for the first active extension version; trusted publishing cannot be used yet.');
              await core.summary.addHeading('Open VSX publication is waiting')
                .addRaw('Trusted publishing needs an active version of whwitpohe.linyra. No package was uploaded.').write();
              return;
            }
            if (!extensionResponse.ok) throw new Error(`Cannot check the active extension: HTTP ${extensionResponse.status}`);
            core.setOutput('ready', 'true');

  publish:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check release and successful source CI
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Choose a stable vX.Y.Z release tag.');
            const repo = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            if (release.draft || release.prerelease) throw new Error('Only published stable releases can be synced.');
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: tag });
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'ci.yml', head_sha: commit.sha, branch: 'main', event: 'push', per_page: 100,
            });
            const run = runs.workflow_runs.find((item) => item.head_sha === commit.sha);
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('The release source must have a successful main CI run before publishing.');
            }
            const version = tag.slice(1);
            const filename = `whwitpohe.linyra-${version}.vsix`;
            const asset = release.assets.find((item) => item.name === filename && item.state === 'uploaded');
            if (!asset || !/^sha256:[a-f0-9]{64}$/i.test(asset.digest ?? '')) {
              throw new Error('The release must contain the VSIX with its GitHub SHA-256 digest.');
            }
            if (!release.assets.some((item) => item.name === 'SHA256SUMS.txt' && item.state === 'uploaded')) {
              throw new Error('The release must contain SHA256SUMS.txt.');
            }
            core.setOutput('tag', tag);
            core.setOutput('version', version);
            core.setOutput('filename', filename);
            core.setOutput('digest', asset.digest.toLowerCase());
            core.info(`Syncing ${filename} from release ${tag}; source CI: ${run.html_url}`);

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download the existing release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VSIX_NAME: ${{ steps.release.outputs.filename }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern "$VSIX_NAME" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/open-vsx"

      - name: Verify package identity and both SHA-256 values
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          VSIX_NAME: ${{ steps.release.outputs.filename }}
          ASSET_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'open-vsx');
          const file = join(dir, process.env.VSIX_NAME);
          const hash = createHash('sha256').update(readFileSync(file)).digest('hex');
          assert.equal(`sha256:${hash}`, process.env.ASSET_DIGEST, 'The package differs from the GitHub release asset.');
          const sums = readFileSync(join(dir, 'SHA256SUMS.txt'), 'utf8').trim().split(/\r?\n/)
            .map((line) => /^([a-f0-9]{64})\s+\*?(.+)$/i.exec(line.trim()))
            .filter((match) => match?.[2] === process.env.VSIX_NAME);
          assert.equal(sums.length, 1, 'Expected one checksum for this VSIX.');
          assert.equal(hash, sums[0][1].toLowerCase(), 'SHA256SUMS.txt does not match the VSIX.');
          const manifest = JSON.parse(execFileSync('unzip', ['-p', file, 'extension/package.json'], { encoding: 'utf8' }));
          assert.equal(manifest.publisher, 'whwitpohe');
          assert.equal(manifest.name, 'linyra');
          assert.equal(manifest.version, process.env.RELEASE_VERSION);
          console.log(`Verified whwitpohe.linyra ${manifest.version}: ${hash}`);
          NODE

      - name: Publish the same VSIX with trusted publishing
        env:
          VSIX_NAME: ${{ steps.release.outputs.filename }}
        run: npx --yes ovsx@1.3.0 publish "$RUNNER_TEMP/open-vsx/$VSIX_NAME" --trusted-publishing --skip-duplicate
