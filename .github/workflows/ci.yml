name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo and uploads an artifact.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails if a denylisted name (employer, internal repo/service/branch/ticket/module)
  # appears in tracked files, file names or commit metadata. The list lives in the
  # LINYRA_DENYLIST secret, never in the repo; an empty list fails, never passes.
  denylist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-denylist.mjs
        env:
          LINYRA_DENYLIST: ${{ secrets.LINYRA_DENYLIST }}

  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS verification on an explicit supported Intel image instead
        # of allowing the latest alias to change its OS and architecture.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run compile
      - run: npm test
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      # package.json "engines" promises 1.85; test the floor, not only the latest.
      - name: Integration tests on the engine floor (Linux, VS Code 1.85.0)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          LINYRA_VSCODE_VERSION: "1.85.0"

  # CLAUDE.md constraint 2 and spec §6: no literal colors or fonts, and
  # impeccable's detector rules (contrast, focus states, gray-on-color, nested
  # cards) run against the real webview source.
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run check:theme
      - run: npm run harness:build
      - run: npm run check:design

  package:
    needs: [denylist, test, design]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINYRA_DENYLIST: ${{ secrets.LINYRA_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx vsce package --no-dependencies -o linyra.vsix
      # Scan what actually ships, not only the source it was built from.
      - run: mkdir vsix && unzip -q linyra.vsix -d vsix && node scripts/check-denylist.mjs --dir vsix
      - uses: actions/upload-artifact@v4
        with:
          name: linyra-vsix
          path: linyra.vsix
