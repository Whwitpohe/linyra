<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Linyra: two interwoven history loops, without letters or merge-node imagery.
       Editable source for icon.png (256px) and publisher-icon.png (128px). -->
  <defs>
    <linearGradient id="tile" x1="20" y1="16" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17243d"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="upper" x1="56" y1="46" x2="156" y2="162" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b4a8ff"/>
      <stop offset="1" stop-color="#7678ee"/>
    </linearGradient>
    <linearGradient id="lower" x1="100" y1="98" x2="200" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75e9e5"/>
      <stop offset="1" stop-color="#29bfcf"/>
    </linearGradient>
    <mask id="upper-weave" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white"/>
      <path d="M100 143 V174" fill="none" stroke="black" stroke-width="30"/>
    </mask>
    <mask id="lower-weave" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white"/>
      <path d="M156 85 V117" fill="none" stroke="black" stroke-width="30"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <g fill="none" stroke-width="18" stroke-linejoin="round">
    <path d="M106 46 156 75 V133 L106 162 56 133 V75 Z" stroke="url(#upper)" mask="url(#upper-weave)"/>
    <path d="M150 98 200 127 V185 L150 214 100 185 V127 Z" stroke="url(#lower)" mask="url(#lower-weave)"/>
  </g>
</svg>
